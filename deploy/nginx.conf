# Static site server for dist/. The app uses HashRouter, so every page is
# index.html and no SPA rewrite is needed; unknown paths return 404.
server_tokens off;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types application/json text/css application/javascript image/svg+xml;
    autoindex off;

    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 30s;

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/snippets/security-headers.conf;

    # Read-only site: only GET and HEAD.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    error_page 404 /404.html;

    # Never serve dotfiles (.git, .env, ...).
    location ~ /\. {
        return 404;
    }

    # Cloudflare config file that Vite copies into dist/; not for nginx clients.
    location = /_headers {
        return 404;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Vite output names carry a content hash, so they can be cached forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Exam bundle changes on every db build: always revalidate (ETag).
    location = /data/toeic.json {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location /data/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
